<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Scan</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-color: #0f0f13;
            overflow: hidden; 
            touch-action: manipulation; /* Mobile optimization */
        }

        /* --- Intro Screen --- */
        #intro {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a24;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer;
            transition: opacity 0.5s ease-out;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem; color: #ff1493;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding: 20px;
        }

        /* --- Main Content (Scanner Phase) --- */
        #scanner-phase {
            text-align: center; z-index: 10;
            width: 90%; max-width: 600px;
            font-family: 'Share Tech Mono', monospace;
            opacity: 0; transition: opacity 1s;
        }

        .terminal-text {
            color: #00ffcc;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-text {
            color: #ff0055 !important;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.7) !important;
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        /* --- The Climax Container --- */
        #climax-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }

        .happy-bday-shout {
            font-family: 'Poppins', sans-serif; 
            font-size: 14vw; color: #ff1493;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #fff, 0 0 30px #ff1493;
            opacity: 0; position: absolute;
            text-align: center;
            line-height: 1.1;
        }

        .bauniii-text {
            font-family: 'Poppins', sans-serif; 
            font-size: 22vw; font-weight: 900; 
            color: #ff0055;
            text-transform: uppercase;
            opacity: 0; position: absolute;
            -webkit-text-stroke: 2px white;
            text-shadow: 0 0 50px rgba(255,0,85,1);
        }

        /* Animations */
        .show-shout {
            animation: explodeIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .show-bauniii {
            animation: bounceAndTakeOver 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes explodeIn {
            0% { transform: scale(0); opacity: 0; }
            40% { transform: scale(1.2); opacity: 1; }
            60% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes bounceAndTakeOver {
            0% { transform: scale(0) translateY(-300px); opacity: 0; }
            30% { transform: scale(1.2) translateY(0); opacity: 1; }
            45% { transform: scale(0.8) translateY(-50px); opacity: 1; }
            60% { transform: scale(1.1) translateY(0); opacity: 1; }
            100% { transform: scale(30); opacity: 0; } 
        }

        /* Confetti */
        .confetti { position: absolute; top: -10px; z-index: 1; opacity: 0.8; }

        /* --- Desktop Scaling Adjustments --- */
        @media (min-width: 768px) {
            #intro { font-size: 2em; }
            .terminal-text { font-size: 2.5em; min-height: 120px; }
            .happy-bday-shout { font-size: 6vw; }
            .bauniii-text { font-size: 10vw; -webkit-text-stroke: 4px white; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="https://files.catbox.moe/yengmd.mp3"></audio>

    <div id="intro">[ CLICK TO INITIALIZE SCAN ]</div>

    <div id="scanner-phase">
        <div class="terminal-text" id="terminal-display"></div>
    </div>

    <div id="climax-container">
        <div class="happy-bday-shout" id="shout-text">AEE HAPPY<br>BIRTHDAY!</div>
        <div class="bauniii-text" id="bauniii-text">BAUNIII!</div>
    </div>

    <script>
        const introScreen = document.getElementById('intro');
        const music = document.getElementById('bg-music');
        const scannerPhase = document.getElementById('scanner-phase');
        const terminalDisplay = document.getElementById('terminal-display');
        const shoutText = document.getElementById('shout-text');
        const bauniiiText = document.getElementById('bauniii-text');
        const mainPalette = ['#00ffcc', '#ff1493', '#ffffff', '#ff0055', '#a200ff'];

        let birthdayTriggered = false;
        let bauniiiTriggered = false;

        const SHOUT_TIME = 43.0;   
        const BAUNIII_TIME = 47.0; 

        const sequence = [
            { time: 0, text: "> System Initializing..." },
            { time: 6, text: "> Locating target: Dumbo" },
            { time: 10, text: "> Aliases: Kanu / Kanak" },
            { time: 15, text: "> Calibrating vertical axis..." },
            { time: 20, text: "> ERROR: Subject not found above 4 feet", error: true },
            { time: 25, text: "> Scanning floor level..." },
            { time: 28, text: "> Target acquired (barely)." },
            { time: 31, text: "> Preparing to launch birthday sequence..." },
            { time: 33, text: "> 10..." },
            { time: 34, text: "> 9..." },
            { time: 35, text: "> 8..." },
            { time: 36, text: "> 7..." },
            { time: 37, text: "> 6..." },
            { time: 38, text: "> 5..." },
            { time: 39, text: "> 4..." },
            { time: 40, text: "> 3..." },
            { time: 41, text: "> 2..." },
            { time: 42, text: "> 1..." }
        ];

        introScreen.addEventListener('click', () => {
            introScreen.style.opacity = '0';
            music.play();
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                scannerPhase.style.opacity = '1';
            }, 500);
        });

        music.addEventListener('timeupdate', () => {
            const currentTime = music.currentTime;

            if (!birthdayTriggered) {
                let currentMessage = sequence[0];
                for (let i = 0; i < sequence.length; i++) {
                    if (currentTime >= sequence[i].time) {
                        currentMessage = sequence[i];
                    }
                }
                
                if (terminalDisplay.innerText !== currentMessage.text) {
                    terminalDisplay.innerText = currentMessage.text;
                    if (currentMessage.error) {
                        terminalDisplay.classList.add('error-text');
                    } else {
                        terminalDisplay.classList.remove('error-text');
                    }
                }
            }

            if (currentTime >= SHOUT_TIME && !birthdayTriggered) {
                triggerBirthdayShout();
            }

            if (currentTime >= BAUNIII_TIME && !bauniiiTriggered) {
                triggerBauniiiScream();
            }
        });

        function triggerBirthdayShout() {
            birthdayTriggered = true;
            scannerPhase.style.display = 'none'; 
            document.body.style.backgroundColor = '#1a0011'; 
            shoutText.classList.add('show-shout');
            
            for(let i=0; i<30; i++) setTimeout(createConfetti, i * 50);
        }

        function triggerBauniiiScream() {
            bauniiiTriggered = true;
            shoutText.style.display = 'none'; 
            document.body.style.backgroundColor = '#0f0f13'; 
            bauniiiText.classList.add('show-bauniii');
            
            for(let i=0; i<100; i++) setTimeout(createConfetti, i * 15);
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            const size = Math.random() * 10 + 5 + 'px';
            confetti.style.width = size; confetti.style.height = size;
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = mainPalette[Math.floor(Math.random() * mainPalette.length)];
            
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            
            document.body.appendChild(confetti);

            let topPosition = -10, rotation = 0;
            const fallSpeed = Math.random() * 8 + 4;
            const rotationSpeed = (Math.random() - 0.5) * 15;

            function animateConfetti() {
                topPosition += fallSpeed; rotation += rotationSpeed;
                confetti.style.top = topPosition + 'px';
                confetti.style.transform = `rotate(${rotation}deg)`;
                
                if (topPosition < window.innerHeight) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    confetti.remove();
                }
            }
            requestAnimationFrame(animateConfetti);
        }
    </script>
</body>
</html>
